general {
	ignore_empty_input = true
	immediate_render = true
}

background {
	path = ~/.local/share/wallpaper/wallpaper
	color = rgba(45, 53, 61, 1.0)
}

input-field {
	size = 15%, 5%
	outline_thickness = 3
	fade_on_empty = false
	hide_input = false
	inner_color = rgba(66, 80, 71, 1)
	outer_color = rgb(211, 198, 170)
	font_color = rgb(211, 198, 170)
	zindex = 20
}

shape {
	size = 700, 500
	rounding = 60
	color = rgb(2d353b)
}

label {
	text = $TIME12
	color = rgb(211, 198, 170)
	# halign = right
	# valign = bottom
	position = 0, 400
	font_size = 110
	font_family = Fira Bold
}

label {
	text = <i>  $USER </i>
	color = rgb(211, 198, 170)
	position = 0, 100
	font_size = 32
	font_family = Fira Semibold
}
